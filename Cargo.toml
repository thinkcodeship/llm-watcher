[package]
name = "llm-watcher"
version = "0.1.0"
edition = "2021"
description = "Report LLM coding-plan quota burn rate across providers and accounts"
authors = ["Kanshiro LLC"]
license = "MIT"

[[bin]]
name = "llm-watcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
ureq = "3.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
